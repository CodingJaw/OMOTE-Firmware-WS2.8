name: Ubuntu build

on: [push,workflow_dispatch,pull_request]

jobs:
  build:
    runs-on: ubuntu-latest








    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDL2
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev





















      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO env:ESP32-Rev1toRev4
        run: pio run -e esp32-Rev1toRev4

      - name: Build PlatformIO env:ESP32_testboard-Rev1toRev4
        run: pio run -e esp32_testboard-Rev1toRev4

      - name: Build PlatformIO env:ESP32-S3-Rev5andHigher
        run: pio run -e esp32-s3-Rev5andHigher

      - name: Build PlatformIO env:ESP32-S3_testboard-Rev5andHigher
        run: pio run -e esp32-s3_testboard-Rev5andHigher

      - name: Build PlatformIO env:linux_64bit
        run: pio run -e linux_64bit

      - name: Build Waveshare firmware and recovery targets
        run: pio run -e waveshare-esp32-s3-lcd-28 -e waveshare-no-ble -e waveshare-display-test

      - name: Check Waveshare packet, battery and button handling
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . tests/waveshare/board_test.cpp -o /tmp/omote-waveshare-test
          /tmp/omote-waveshare-test

      - name: Check WiFi and MQTT retry behavior
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . tests/network/network_policy_test.cpp -o /tmp/omote-network-test
          /tmp/omote-network-test
          g++ -std=c++17 -Wall -Wextra -Werror -I tests/network/stubs -I . tests/network/mqtt_hal_test.cpp -o /tmp/omote-mqtt-hal-test
          /tmp/omote-mqtt-hal-test
